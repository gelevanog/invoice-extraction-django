[project]
name = "docextract"
version = "0.1.0"
description = "LLM data extraction & enrichment pipeline with a human review queue (Django)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ivan Savchenko" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "celery[redis]>=5.4",
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "structlog>=26.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "reportlab>=5.0.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore:No directory at:UserWarning",  # whitenoise before collectstatic
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["documents/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "DJ", "RUF", "PTH", "S", "N"]
ignore = [
    "S101",   # assert is fine in tests
    "RUF012", # Django Meta/admin class attributes are not mutable-default bugs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["config", "documents", "extraction"]

[tool.mypy]
python_version = "3.12"
files = ["extraction"]
strict = true
ignore_missing_imports = true
